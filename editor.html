<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MidSoul Wiki 编辑器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <!-- highlight.js for code blocks -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    /* ══════════════════════════════════════════════════
       TOKENS
       ══════════════════════════════════════════════════ */
    :root {
      --primary:        #7367F0;
      --primary-dark:   #5a50d4;
      --primary-light:  #9d94f5;
      --primary-faint:  #bdb8f9;

      --font-sans:  'Noto Sans SC', 'PingFang SC', sans-serif;
      --font-serif: 'Noto Serif SC', serif;
      --font-mono:  'JetBrains Mono', 'Fira Code', monospace;

      --radius: 4px;
      --transition: 0.18s ease;
    }

    [data-theme="dark"] {
      --bg:          #06050f;
      --bg2:         #0c0b1e;
      --bg3:         #12102a;
      --border:      rgba(115, 103, 240, 0.18);
      --border-h:    rgba(115, 103, 240, 0.4);
      --surface:     rgba(115, 103, 240, 0.06);
      --surface2:    rgba(115, 103, 240, 0.11);
      --surface3:    rgba(115, 103, 240, 0.18);
      --text:        rgba(237, 233, 255, 0.92);
      --text-dim:    rgba(237, 233, 255, 0.55);
      --text-muted:  rgba(237, 233, 255, 0.35);
      --scrollbar:   rgba(115, 103, 240, 0.3);
    }

    [data-theme="light"] {
      --bg:          #f8f7ff;
      --bg2:         #ffffff;
      --bg3:         #f0eeff;
      --border:      rgba(115, 103, 240, 0.2);
      --border-h:    rgba(115, 103, 240, 0.45);
      --surface:     rgba(115, 103, 240, 0.05);
      --surface2:    rgba(115, 103, 240, 0.09);
      --surface3:    rgba(115, 103, 240, 0.15);
      --text:        rgba(20, 15, 60, 0.9);
      --text-dim:    rgba(20, 15, 60, 0.6);
      --text-muted:  rgba(20, 15, 60, 0.38);
      --scrollbar:   rgba(115, 103, 240, 0.25);
    }

    /* ══════════════════════════════════════════════════
       RESET & BASE
       ══════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(115,103,240,0.55); }
    ::selection { background: rgba(115,103,240,0.3); }

    /* ══════════════════════════════════════════════════
       LAYOUT
       ══════════════════════════════════════════════════ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── HEADER ── */
    #header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 1rem;
      height: 52px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 10;
    }

    #header .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-right: 0.5rem;
    }

    #header .logo-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }

    #header .logo-icon svg { width: 16px; height: 16px; fill: white; }

    #header .logo-text {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      color: var(--text);
    }

    #header .logo-badge {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--primary-light);
      border: 1px solid var(--border);
      padding: 0.1em 0.5em;
      border-radius: 2px;
      background: var(--surface);
    }

    .h-sep { flex: 1; }

    /* ── TOOLBAR ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 1rem;
      height: 40px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #toolbar::-webkit-scrollbar { display: none; }

    .tb-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
      flex-shrink: 0;
    }

    .tb-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 0 8px;
      height: 28px;
      border: none;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), color var(--transition);
      flex-shrink: 0;
    }

    .tb-btn:hover {
      background: var(--surface2);
      color: var(--primary-light);
    }

    .tb-btn.tb-accent {
      background: var(--surface2);
      color: var(--primary-light);
      border: 1px solid var(--border);
    }

    .tb-btn.tb-accent:hover {
      background: var(--surface3);
      border-color: var(--border-h);
      color: var(--primary);
    }

    .tb-btn .icon {
      width: 13px; height: 13px;
      flex-shrink: 0;
      opacity: 0.8;
    }

    .tb-label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 0 6px;
      flex-shrink: 0;
    }

    /* ── MAIN AREA ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── EDITOR PANE ── */
    #editor-pane {
      display: flex;
      flex-direction: column;
      width: 50%;
      min-width: 280px;
      border-right: 1px solid var(--border);
      position: relative;
      flex-shrink: 0;
    }

    #fm-section {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    #fm-header {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    #fm-header:hover { background: var(--surface3); }

    #fm-header span {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    #fm-header .fm-chevron {
      margin-left: auto;
      width: 12px; height: 12px;
      transition: transform 0.2s;
      color: var(--text-muted);
    }

    #fm-section.collapsed #fm-header .fm-chevron { transform: rotate(-90deg); }

    #fm-fields {
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      overflow: hidden;
      max-height: 200px;
      transition: max-height 0.25s ease, padding 0.25s ease;
    }

    #fm-section.collapsed #fm-fields {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .fm-field {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fm-field label {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .fm-field input {
      width: 60px;
      height: 24px;
      padding: 0 6px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      outline: none;
      transition: border-color var(--transition);
    }

    .fm-field input:focus {
      border-color: var(--primary);
    }

    .fm-field input[type="text"] { width: 140px; }

    #editor-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #editor {
      position: absolute;
      inset: 0;
      padding: 16px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.75;
      tab-size: 2;
      caret-color: var(--primary);
      overflow-y: auto;
      scrollbar-width: thin;
    }

    /* ── RESIZE HANDLE ── */
    #resize-handle {
      position: absolute;
      top: 0; bottom: 0; right: -3px;
      width: 6px;
      cursor: col-resize;
      z-index: 5;
      background: transparent;
      transition: background 0.15s;
    }

    #resize-handle:hover,
    #resize-handle.dragging {
      background: rgba(115,103,240,0.25);
    }

    /* ── PREVIEW PANE ── */
    #preview-pane {
      flex: 1;
      overflow-y: auto;
      min-width: 280px;
    }

    #preview-inner {
      padding: 2rem 2.5rem;
      max-width: 860px;
    }

    /* ══════════════════════════════════════════════════
       STATUS BAR
       ══════════════════════════════════════════════════ */
    #statusbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1rem;
      height: 26px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sb-item {
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .sb-item.sb-ok { color: rgba(115,240,180,0.7); }
    .sb-item.sb-warn { color: rgba(240,200,100,0.8); }

    /* ══════════════════════════════════════════════════
       ICON BUTTON (header)
       ══════════════════════════════════════════════════ */
    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--surface2);
      border-color: var(--border-h);
      color: var(--primary-light);
    }

    .icon-btn svg { width: 15px; height: 15px; }

    .icon-btn.active {
      background: var(--surface3);
      border-color: var(--border-h);
      color: var(--primary-light);
    }

    /* ══════════════════════════════════════════════════
       COPY TOAST
       ══════════════════════════════════════════════════ */
    #toast {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--primary-light);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ══════════════════════════════════════════════════
       MODAL (snippet picker)
       ══════════════════════════════════════════════════ */
    #modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: min(620px, 92vw);
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: modal-in 0.2s ease;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: scale(0.96) translateY(-8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    #modal-header {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    #modal-header h3 {
      font-family: var(--font-serif);
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      flex: 1;
    }

    #modal-close {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1rem;
      transition: all var(--transition);
    }

    #modal-close:hover {
      background: var(--surface2);
      color: var(--text);
    }

    #modal-body {
      overflow-y: auto;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }

    .snippet-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--surface);
    }

    .snippet-card:hover {
      border-color: var(--border-h);
      background: var(--surface2);
      transform: translateY(-2px);
    }

    .snippet-card .sc-icon {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .snippet-card .sc-name {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--primary-light);
      margin-bottom: 3px;
    }

    .snippet-card .sc-desc {
      font-size: 0.68rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* ══════════════════════════════════════════════════
       PREVIEW STYLES (matching site)
       ══════════════════════════════════════════════════ */
    .preview-content {
      font-family: var(--font-sans);
      line-height: 2;
      color: var(--text);
    }

    .preview-content h1 {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 2rem;
      letter-spacing: 0.12em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5em;
      margin-bottom: 1.5rem;
    }

    [data-theme="dark"] .preview-content h1 {
      background: linear-gradient(120deg, #ffffff, #c8c2ff 60%, #9d94f5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    [data-theme="light"] .preview-content h1 {
      background: linear-gradient(120deg, #1a1040, #5a50d4 60%, #7367F0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .preview-content h2 {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3em;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
    }

    .preview-content h3 {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      margin-top: 1.8rem;
      margin-bottom: 0.8rem;
    }

    .preview-content h4 {
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      margin-top: 1.5rem;
      margin-bottom: 0.6rem;
      color: var(--primary-light);
    }

    .preview-content p { margin: 0.8rem 0; }

    .preview-content a {
      color: var(--primary);
      text-decoration: none;
      border-bottom: 1px solid rgba(115,103,240,0.3);
      transition: border-color var(--transition), color var(--transition);
    }

    .preview-content a:hover {
      color: var(--primary-light);
      border-color: var(--primary);
    }

    .preview-content strong { font-weight: 600; }

    .preview-content em { font-style: italic; color: var(--text-dim); }

    .preview-content ul, .preview-content ol {
      padding-left: 1.6em;
      margin: 0.8rem 0;
    }

    .preview-content li { margin: 0.3rem 0; }

    .preview-content blockquote {
      border-left: 3px solid var(--primary);
      background: var(--surface);
      margin: 1.5rem 0;
      padding: 0.8rem 1.2rem;
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--text-dim);
    }

    .preview-content code {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 0.88em;
      padding: 0.15em 0.45em;
      color: var(--primary-light);
      font-family: var(--font-mono);
    }

    .preview-content pre {
      background: var(--bg3) !important;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
    }

    .preview-content pre code {
      background: none;
      border: none;
      padding: 0;
      color: inherit;
      font-size: 0.85em;
    }

    .preview-content table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.85rem;
      margin: 1.5rem 0;
      border: 1px solid var(--border);
    }

    .preview-content thead tr {
      background: var(--surface2);
    }

    .preview-content th {
      font-weight: 500;
      letter-spacing: 0.06em;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      padding: 0.6rem 0.9rem;
      text-align: left;
    }

    .preview-content td {
      border: 1px solid var(--border);
      padding: 0.55rem 0.9rem;
      line-height: 1.8;
    }

    .preview-content tbody td:first-child,
    .preview-content thead th:first-child {
      background: var(--surface2);
    }

    .preview-content tbody tr:hover td {
      background: var(--surface);
    }

    .preview-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .preview-content img {
      max-width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    /* ── Custom component renders ── */

    /* ColorTable wrapper */
    .ms-colortable-wrap { margin: 1.5rem 0; }

    /* muted span */
    .preview-content .ms-muted {
      color: var(--text-muted);
    }

    /* Label component */
    .ms-label {
      display: inline-block;
      padding: 0.1em 0.55em;
      font-size: 0.78em;
      font-weight: 500;
      line-height: 1.6;
      border-radius: 3px;
      white-space: nowrap;
      vertical-align: middle;
    }

    /* Frontmatter block in preview */
    .preview-frontmatter {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-bottom: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .preview-frontmatter .fm-tag {
      color: var(--primary-light);
    }

    /* Unknown component notice */
    .ms-component-notice {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(115,103,240,0.06);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 4px 0;
    }

    /* ══════════════════════════════════════════════════
       SCROLLBAR IN PANES
       ══════════════════════════════════════════════════ */
    #editor, #preview-pane {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar) transparent;
    }
  </style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header id="header">
    <div class="logo">
      <div class="logo-icon">
        <!-- book icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
      </div>
      <span class="logo-text">MidSoul Wiki</span>
      <span class="logo-badge">编辑器</span>
    </div>

    <div class="h-sep"></div>

    <!-- Theme toggle -->
    <button class="icon-btn" id="theme-btn" title="切换主题">
      <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>

/* ══════════════════════════════════════════════════
   FRONTMATTER PARSER
   ══════════════════════════════════════════════════ */
function parseFrontmatter(text) {
  const match = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!match) return { fm: {}, body: text };
  const raw = match[1];
  const body = match[2];
  const fm = {};
  raw.split('\n').forEach(line => {
    const m = line.match(/^(\w+):\s*(.*)$/);
    if (m) fm[m[1]] = m[2].replace(/^['"]|['"]$/g, '');
  });
  return { fm, body };
}

function buildFrontmatter() {
  const pos   = document.getElementById('fm-pos').value.trim();
  const title = document.getElementById('fm-title').value.trim();
  const desc  = document.getElementById('fm-desc').value.trim();
  let lines = [];
  if (pos)   lines.push(`sidebar_position: ${pos}`);
  if (title) lines.push(`title: "${title}"`);
  if (desc)  lines.push(`description: "${desc}"`);
  if (!lines.length) return '';
  return `---\n${lines.join('\n')}\n---\n\n`;
}

/* ══════════════════════════════════════════════════
   MDX → HTML RENDERER (custom components)
   ══════════════════════════════════════════════════ */
function renderMDX(source) {
  let processed = source;

  // Handle <span className="muted">
  processed = processed.replace(
    /<span\s+className="muted">([\s\S]*?)<\/span>/g,
    '<span class="ms-muted">$1</span>'
  );

  // Handle <span style={{color:'...'}}>
  processed = processed.replace(
    /<span\s+style=\{\{color:'([^']+)'\}\}>([\s\S]*?)<\/span>/g,
    '<span style="color:$1">$2</span>'
  );

  // Handle <Label color="...">...</Label>
  const LABEL_COLORS = {
    purple: { bg: 'rgba(115,103,240,0.15)', text: '#9d94f5', border: 'rgba(115,103,240,0.35)' },
    blue:   { bg: 'rgba(59,130,246,0.12)',  text: '#93c5fd', border: 'rgba(59,130,246,0.35)'  },
    green:  { bg: 'rgba(34,197,94,0.12)',   text: '#86efac', border: 'rgba(34,197,94,0.35)'   },
    red:    { bg: 'rgba(239,68,68,0.12)',   text: '#fca5a5', border: 'rgba(239,68,68,0.35)'   },
    yellow: { bg: 'rgba(234,179,8,0.12)',   text: '#fde68a', border: 'rgba(234,179,8,0.35)'   },
    gray:   { bg: 'rgba(107,114,128,0.12)', text: '#d1d5db', border: 'rgba(107,114,128,0.35)' },
  };

  processed = processed.replace(
    /<Label\s+color="(\w+)">([\s\S]*?)<\/Label>/g,
    (_, color, content) => {
      const c = LABEL_COLORS[color] || LABEL_COLORS.gray;
      return `<span class="ms-label" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">${content}</span>`;
    }
  );

  // Handle <ColorTable ...>...</ColorTable>
  processed = processed.replace(
    /<ColorTable([\s\S]*?)>([\s\S]*?)<\/ColorTable>/g,
    (match, attrs, inner) => {
      // We'll parse attrs to get cols/rows/cells/hideHeader/noFirstCol
      const hideHeader = /hideHeader/.test(attrs);
      const noFirstCol = /noFirstCol/.test(attrs);

      // Parse cols array
      let cols = [];
      const colsMatch = attrs.match(/cols=\{(\[[\s\S]*?\])\}/);
      if (colsMatch) {
        try { cols = JSON.parse(colsMatch[1].replace(/'/g, '"')); } catch(e) {}
      }

      // Parse rows array
      let rows = [];
      const rowsMatch = attrs.match(/rows=\{(\[[\s\S]*?\])\}/);
      if (rowsMatch) {
        try { rows = JSON.parse(rowsMatch[1].replace(/'/g, '"')); } catch(e) {}
      }

      // Parse header array
      let header = [];
      const headerMatch = attrs.match(/header=\{(\[[\s\S]*?\])\}/);
      if (headerMatch) {
        try { header = JSON.parse(headerMatch[1].replace(/'/g, '"')); } catch(e) {}
      }

      // Parse cells array (nested)
      let cells = [];
      const cellsMatch = attrs.match(/cells=\{(\[[\s\S]*?\])\}/);
      if (cellsMatch) {
        try { cells = JSON.parse(cellsMatch[1].replace(/'/g, '"')); } catch(e) {}
      }

      // Generate unique ID for scoping
      const uid = 'ct' + Math.random().toString(36).slice(2, 8);

      // Build CSS rules
      const isDark = html.getAttribute('data-theme') === 'dark';
      const rules = [];

      function colorRule(sel, rgba) {
        if (!rgba) return;
        // darken for dark mode
        let bg = rgba;
        if (isDark) {
          // simple darkening: parse rgba and reduce alpha / mix with dark
          const m = rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
          if (m) {
            const a = parseFloat(m[4] ?? 1);
            bg = `rgba(${m[1]},${m[2]},${m[3]},${Math.min(a * 0.6, 0.5)})`;
          }
        }
        rules.push(`#${uid} ${sel} { background-color: ${bg} !important; }`);
      }

      header.forEach((val, i) => colorRule(`thead th:nth-child(${i+1})`, val));
      cols.forEach((val, i) => colorRule(`tbody td:nth-child(${i+1})`, val));
      rows.forEach((val, i) => colorRule(`tbody tr:nth-child(${i+1}) td`, val));
      cells.forEach(([r, c, val]) => colorRule(`tbody tr:nth-child(${r}) td:nth-child(${c})`, val));

      if (hideHeader) rules.push(`#${uid} thead { display: none; }`);
      if (noFirstCol) rules.push(`#${uid} tbody td:first-child, #${uid} thead th:first-child { background: none !important; }`);

      const styleTag = rules.length ? `<style>${rules.join('\n')}</style>` : '';
      // Render inner markdown (the table)
      const innerHtml = marked.parse(inner.trim());
      return `<div id="${uid}" class="ms-colortable-wrap">${styleTag}${innerHtml}</div>`;
    }
  );

  return processed;
}

/* ══════════════════════════════════════════════════
   PREVIEW RENDERER
   ══════════════════════════════════════════════════ */
const editor = document.getElementById('editor');
const previewContent = document.getElementById('preview-content');
const previewFm = document.getElementById('preview-fm');
const sbChars = document.getElementById('sb-chars');
const sbLines = document.getElementById('sb-lines');
const sbWords = document.getElementById('sb-words');
const sbStatus = document.getElementById('sb-status');

function updatePreview() {
  const raw = editor.value;
  const fm = buildFrontmatter();

  // Parse frontmatter from textarea (if manually written)
  const parsed = parseFrontmatter(raw);

  // Show frontmatter block in preview
  const hasManualFm = raw.startsWith('---');
  if (hasManualFm || fm) {
    const displayFm = hasManualFm ? parsed.fm : {};
    if (!hasManualFm) {
      const pos   = document.getElementById('fm-pos').value.trim();
      const title = document.getElementById('fm-title').value.trim();
      const desc  = document.getElementById('fm-desc').value.trim();
      if (pos)   displayFm.sidebar_position = pos;
      if (title) displayFm.title = title;
      if (desc)  displayFm.description = desc;
    }
    const fmLines = Object.entries(displayFm)
      .map(([k,v]) => `<span class="fm-tag">${k}:</span> ${v}`)
      .join('<br>');
    if (fmLines) {
      previewFm.innerHTML = `<span style="color:var(--border-h)">---</span><br>${fmLines}<br><span style="color:var(--border-h)">---</span>`;
      previewFm.style.display = 'block';
    } else {
      previewFm.style.display = 'none';
    }
  } else {
    previewFm.style.display = 'none';
  }

  // Body to render
  const body = hasManualFm ? parsed.body : raw;

  try {
    const mdxProcessed = renderMDX(body);
    const html_out = marked.parse(mdxProcessed);
    previewContent.innerHTML = html_out;
    sbStatus.textContent = '预览正常';
    sbStatus.className = 'sb-item sb-ok';
  } catch(e) {
    sbStatus.textContent = '渲染错误';
    sbStatus.className = 'sb-item sb-warn';
    console.error(e);
  }

  // Stats
  const chars = raw.length;
  const lines = raw.split('\n').length;
  const words = raw.trim() ? raw.trim().split(/\s+/).length : 0;
  sbChars.textContent = `${chars} 字符`;
  sbLines.textContent = `${lines} 行`;
  sbWords.textContent = `${words} 词`;
}

// Debounced update
let updateTimer;
function scheduleUpdate() {
  clearTimeout(updateTimer);
  updateTimer = setTimeout(updatePreview, 80);
}

editor.addEventListener('input', scheduleUpdate);
['fm-pos','fm-title','fm-desc'].forEach(id => {
  document.getElementById(id).addEventListener('input', scheduleUpdate);
});

/* ══════════════════════════════════════════════════
   TOOLBAR ACTIONS
   ══════════════════════════════════════════════════ */
function getSelection() {
  const start = editor.selectionStart;
  const end   = editor.selectionEnd;
  const text  = editor.value;
  return { start, end, selected: text.slice(start, end), before: text.slice(0, start), after: text.slice(end) };
}

function insertAtCursor(before, after = '', defaultText = '文字') {
  const { start, end, selected } = getSelection();
  const insert = selected || defaultText;
  const newVal = editor.value.slice(0, start) + before + insert + after + editor.value.slice(end);
  editor.value = newVal;
  const newStart = start + before.length;
  const newEnd   = newStart + insert.length;
  editor.focus();
  editor.setSelectionRange(newStart, newEnd);
  scheduleUpdate();
}

function insertLinePrefix(prefix) {
  const { start, end } = getSelection();
  const text = editor.value;
  // Find line start
  let lineStart = text.lastIndexOf('\n', start - 1) + 1;
  const line = text.slice(lineStart, text.indexOf('\n', start) === -1 ? text.length : text.indexOf('\n', start));
  // Remove existing heading prefix if any
  const cleaned = line.replace(/^#{1,6}\s?/, '');
  const newLine = prefix + cleaned;
  const newVal = text.slice(0, lineStart) + newLine + text.slice(lineStart + line.length);
  editor.value = newVal;
  editor.focus();
  editor.setSelectionRange(lineStart + prefix.length, lineStart + newLine.length);
  scheduleUpdate();
}

function insertBlock(text) {
  const { start } = getSelection();
  const val = editor.value;
  // Ensure blank line before
  const before = val.slice(0, start);
  const after  = val.slice(start);
  const prefix = (before.length > 0 && !before.endsWith('\n\n')) ? '\n\n' : '';
  const suffix = after.startsWith('\n') ? '' : '\n';
  editor.value = before + prefix + text + suffix + after;
  editor.focus();
  const pos = start + prefix.length + text.length + suffix.length;
  editor.setSelectionRange(pos, pos);
  scheduleUpdate();
}

function insertRaw(text) {
  const { start, end } = getSelection();
  editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
  editor.focus();
  editor.setSelectionRange(start + text.length, start + text.length);
  scheduleUpdate();
}

const ACTIONS = {
  bold:          () => insertAtCursor('**', '**', '粗体文字'),
  italic:        () => insertAtCursor('*', '*', '斜体文字'),
  strikethrough: () => insertAtCursor('~~', '~~', '删除线文字'),
  h1:            () => insertLinePrefix('# '),
  h2:            () => insertLinePrefix('## '),
  h3:            () => insertLinePrefix('### '),
  h4:            () => insertLinePrefix('#### '),
  blockquote:    () => insertLinePrefix('> '),
  code:          () => {
    const { selected } = getSelection();
    if (selected.includes('\n')) {
      insertBlock('```\n' + (selected || '代码') + '\n```');
    } else {
      insertAtCursor('`', '`', '代码');
    }
  },
  table: () => insertBlock(
`| 列1 | 列2 | 列3 |
| :-- | :-- | :-- |
| 内容 | 内容 | 内容 |
| 内容 | 内容 | 内容 |`
  ),
  hr:   () => insertBlock('---'),
  ul:   () => insertLinePrefix('- '),
  ol:   () => insertLinePrefix('1. '),
  muted: () => insertAtCursor('<span className="muted">', '</span>', '灰色文字'),
  link: () => {
    const { selected } = getSelection();
    const url = '[链接文字](URL)';
    if (selected) {
      insertAtCursor('[', '](URL)', selected);
    } else {
      insertRaw(url);
    }
  },
  img: () => insertRaw('![图片描述](URL)'),
  'snippet-picker': () => openModal(),
};

document.getElementById('toolbar').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (ACTIONS[action]) ACTIONS[action]();
});

/* ══════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
   ══════════════════════════════════════════════════ */
editor.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;

  if (mod && e.key === 'b') { e.preventDefault(); ACTIONS.bold(); }
  if (mod && e.key === 'i') { e.preventDefault(); ACTIONS.italic(); }
  if (mod && e.key === 'k') { e.preventDefault(); ACTIONS.link(); }
  if (mod && e.key === 'j') { e.preventDefault(); ACTIONS.code(); }

  // Tab indentation
  if (e.key === 'Tab') {
    e.preventDefault();
    const { start, end } = getSelection();
    const val = editor.value;
    editor.value = val.slice(0, start) + '  ' + val.slice(end);
    editor.setSelectionRange(start + 2, start + 2);
  }
});

/* ══════════════════════════════════════════════════
   FRONTMATTER TOGGLE
   ══════════════════════════════════════════════════ */
document.getElementById('fm-header').addEventListener('click', () => {
  const sec = document.getElementById('fm-section');
  sec.classList.toggle('collapsed');
  // 立即更新预览并持久化折叠状态
  localStorage.setItem('ms-editor-fm-collapsed', sec.classList.contains('collapsed') ? '1' : '0');
  scheduleUpdate();
});

/* ══════════════════════════════════════════════════
   SNIPPET MODAL
   ══════════════════════════════════════════════════ */
const modalOverlay = document.getElementById('modal-overlay');
const modalBody    = document.getElementById('modal-body');

function openModal() {
  // Build cards
  modalBody.innerHTML = SNIPPETS.map((s, i) => `
    <div class="snippet-card" data-index="${i}">
      <div class="sc-icon">${s.icon}</div>
      <div class="sc-name">${s.name}</div>
      <div class="sc-desc">${s.desc}</div>
    </div>
  `).join('');
  modalOverlay.classList.add('open');
}

function closeModal() {
  modalOverlay.classList.remove('open');
}

modalBody.addEventListener('click', e => {
  const card = e.target.closest('.snippet-card');
  if (!card) return;
  const snippet = SNIPPETS[parseInt(card.dataset.index)];
  insertBlock(snippet.insert);
  closeModal();
});

document.getElementById('modal-close').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ══════════════════════════════════════════════════
   COPY / DOWNLOAD
   ══════════════════════════════════════════════════ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('copy-btn').addEventListener('click', () => {
  const fm = buildFrontmatter();
  const raw = editor.value.startsWith('---') ? editor.value : fm + editor.value;
  navigator.clipboard.writeText(raw).then(() => showToast('✓ 已复制到剪贴板'));
});

document.getElementById('dl-btn').addEventListener('click', () => {
  const fm = buildFrontmatter();
  const raw = editor.value.startsWith('---') ? editor.value : fm + editor.value;

  // Guess filename from H1
  const h1 = raw.match(/^#\s+(.+)/m);
  const filename = h1 ? h1[1].trim().replace(/\s+/g, '') + '.md' : 'document.md';

  const blob = new Blob([raw], { type: 'text/markdown;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ 已下载 ' + filename);
});

/* ══════════════════════════════════════════════════
   RESIZE HANDLE
   ══════════════════════════════════════════════════ */
const handle    = document.getElementById('resize-handle');
const editorPane = document.getElementById('editor-pane');
const mainEl    = document.getElementById('main');

let isResizing = false;
let startX = 0;
let startW = 0;

handle.addEventListener('mousedown', e => {
  isResizing = true;
  startX = e.clientX;
  startW = editorPane.offsetWidth;
  handle.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  const dx = e.clientX - startX;
  const total = mainEl.offsetWidth;
  const newW = Math.max(280, Math.min(total - 280, startW + dx));
  editorPane.style.width = newW + 'px';
});

document.addEventListener('mouseup', () => {
  if (!isResizing) return;
  isResizing = false;
  handle.classList.remove('dragging');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

/* ══════════════════════════════════════════════════
   LOCAL STORAGE — 自动保存 & 恢复
   ══════════════════════════════════════════════════ */
const LS_CONTENT  = 'ms-editor-content';
const LS_FM_POS   = 'ms-editor-fm-pos';
const LS_FM_TITLE = 'ms-editor-fm-title';
const LS_FM_DESC  = 'ms-editor-fm-desc';
const LS_FM_COL   = 'ms-editor-fm-collapsed';

const DEFAULT_CONTENT = `# 文档标题

## 简述

在这里写下文档的简介内容。你可以使用 **粗体**、*斜体* 或 \`行内代码\`。

## 使用提示

> 这是一个引用块，适合展示重要提示。

可以使用工具栏快速插入内容，或点击「插入组件」来添加站点专属的 \`ColorTable\`、\`Label\` 等组件。

### 快捷键

- **Ctrl/⌘ + B** — 粗体
- **Ctrl/⌘ + I** — 斜体
- **Ctrl/⌘ + K** — 链接
- **Ctrl/⌘ + J** — 代码
- **Tab** — 缩进两格

### 组件示例

<span className="muted">这是灰色描述文字，常用于小节副标题</span>

<ColorTable
cols={['rgba(255, 255, 204)', 'rgba(240, 251, 239)', null, null]}>

| 名称 | 颜色A | 颜色B | 普通 |
| :--- | :---- | :---- | :--- |
| 示例 | 黄色列 | 绿色列 | 无色 |

</ColorTable>
`;

// 恢复保存的内容
function restoreFromStorage() {
  const saved = localStorage.getItem(LS_CONTENT);
  editor.value = saved !== null ? saved : DEFAULT_CONTENT;

  const fmPos   = localStorage.getItem(LS_FM_POS);
  const fmTitle = localStorage.getItem(LS_FM_TITLE);
  const fmDesc  = localStorage.getItem(LS_FM_DESC);
  if (fmPos   !== null) document.getElementById('fm-pos').value   = fmPos;
  if (fmTitle !== null) document.getElementById('fm-title').value = fmTitle;
  if (fmDesc  !== null) document.getElementById('fm-desc').value  = fmDesc;

  // 恢复折叠状态
  if (localStorage.getItem(LS_FM_COL) === '1') {
    document.getElementById('fm-section').classList.add('collapsed');
  }
}

// 保存到 localStorage（节流，最多 500ms 一次）
let saveTimer;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(LS_CONTENT,  editor.value);
    localStorage.setItem(LS_FM_POS,   document.getElementById('fm-pos').value);
    localStorage.setItem(LS_FM_TITLE, document.getElementById('fm-title').value);
    localStorage.setItem(LS_FM_DESC,  document.getElementById('fm-desc').value);
    // 更新状态栏提示
    const now = new Date();
    const t = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
    sbStatus.textContent = `已自动保存 ${t}`;
    sbStatus.className = 'sb-item sb-ok';
  }, 500);
}

// 监听所有输入以触发保存
editor.addEventListener('input', scheduleSave);
['fm-pos','fm-title','fm-desc'].forEach(id => {
  document.getElementById(id).addEventListener('input', scheduleSave);
});

// 防止意外关闭时提示（内容有修改时）
window.addEventListener('beforeunload', () => {
  // 直接保存，不等节流
  localStorage.setItem(LS_CONTENT,  editor.value);
  localStorage.setItem(LS_FM_POS,   document.getElementById('fm-pos').value);
  localStorage.setItem(LS_FM_TITLE, document.getElementById('fm-title').value);
  localStorage.setItem(LS_FM_DESC,  document.getElementById('fm-desc').value);
});

/* ══════════════════════════════════════════════════
   INITIAL CONTENT
   ══════════════════════════════════════════════════ */
restoreFromStorage();
updatePreview();
</script>
