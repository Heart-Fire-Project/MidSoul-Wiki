name: 同步发版日志

# 主仓库发版（GitHub Release）后，自动在本仓库 blog/ 生成更新日志。
# 采用「定时拉取」而不是跨仓库触发：只需读主仓库的公开 Releases API，
# 写回本仓库用自身 GITHUB_TOKEN，无需任何跨仓库 token 或手工配置。
# 幂等：按版本号判断，已存在的版本不会重复生成（也能一次性补齐历史发版）。
on:
  schedule:
    # 每小时整点检查一次（GitHub 定时任务可能延迟几分钟到半小时）
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 推送后要手动触发 CI（见最后一步）
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # 脚本只依赖 Node 内置模块，不需要 pnpm install
      - name: 从主仓库 Release 生成更新日志
        env:
          # 主仓库（读它的公开 Releases）
          MAIN_REPO: Heart-Fire-Project/MidSoul
          # 新日志的默认作者，取自 blog/authors.yml 的 key
          BLOG_AUTHORS: hfp,roser
          # 带上 token 提高 API 限额（只读公开数据）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-releases.mjs

      # 新日志是未跟踪文件，git diff 看不见，必须先 add 再比暂存区。
      # 提交信息不能带 [skip ci]：Cloudflare Pages 也认这个标记，会跳过部署。
      # （GITHUB_TOKEN 的推送本来就不会触发 Actions，不存在循环。）
      - name: 提交新日志
        id: commit
        run: |
          git add blog/
          if git diff --cached --quiet; then
            echo "没有新发版，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: 自动同步发版日志"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 的推送不触发 push 事件，这里手动跑一遍 CI：
      # 校验构建，并让 fonts job 补上新日志里的生僻字。
      - name: 触发 CI
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
